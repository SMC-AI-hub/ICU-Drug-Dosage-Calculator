name: QA + deploy

# Nothing reaches the live site unless the clinical gates pass first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa:
    name: Clinical & clinical-DOM gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install the one dev dependency (jsdom)
        run: npm ci

      - name: Rebuild the single-file app and the site from source
        run: python3 build.py

      - name: Stage 1 — numerical & clinical validation
        run: node qa/validate.js

      - name: Stage 3 — offline / installable (PWA) gate
        run: node qa/pwa.js

      - name: Stage 4 — DOM smoke test of the built file
        run: node qa/smoke.js

      - name: Check the single file runs with no storage and no service worker
        run: |
          node -e "
          const {JSDOM,VirtualConsole}=require('jsdom'),fs=require('fs');
          const errs=[]; const vc=new VirtualConsole();
          vc.on('jsdomError',e=>{ if(!/navigation to another Document/.test(e.message)) errs.push(e.message); });
          const html=fs.readFileSync('docs/standalone.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,
            url:'file:///tmp/app.html',virtualConsole:vc,
            beforeParse(w){w.scrollTo=()=>{};w.print=()=>{};w.URL.createObjectURL=()=>'b';
              w.URL.revokeObjectURL=()=>{};w.Element.prototype.scrollIntoView=function(){};}});
          setTimeout(()=>{
            const d=dom.window.document, cards=d.querySelectorAll('#content .card').length;
            const w=dom.window, box=d.querySelector('[id=p_ageY]');
            box.value='4'; box.dispatchEvent(new w.Event('input',{bubbles:true}));
            setTimeout(()=>{
              const n=d.querySelectorAll('#content .card').length;
              console.log('booted with '+cards+' cards; after entering 4 years: '+n);
              if(cards<1||n<1) { console.log('FAILED'); process.exit(1); }
              if(errs.length){ console.log('runtime errors: '+errs.join(' | ')); process.exit(1); }
              console.log('OK — runs from a bare file:// open with no storage');
              process.exit(0);
            },900);
          },700);
          "

      - name: Summary
        if: always()
        run: |
          {
            echo "### Paediatric & Neonatal Drug Calculator"
            echo ""
            echo "Build hash: \`$(grep -o 'mono\">[a-f0-9]*' docs/standalone.html | head -1 | cut -d'>' -f2)\`"
            echo ""
            echo "- numerical & clinical gate: passed"
            echo "- offline / installable gate: 73 assertions"
            echo "- DOM smoke gate: 163 assertions"
            echo "- bare file:// boot with no storage: passed"
          } >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Publish to GitHub Pages
    needs: qa
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: python3 build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
